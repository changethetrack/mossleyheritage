---
layout: default
---
{% assign trail_path = page.url | split: '/stops/' | first %}

<h1 class="stop-page__title">{{ page.trail_name }} &mdash; Stop {{ page.slug }}</h1>

<section class="section">
  <div class="stop-page">
    <h2>{{ page.title }}</h2>
    <div class="stop-page__year">{{ page.year }}</div>
    {{ content }}
    <hr>
    <nav aria-label="Blog navigation">
      {% if page.previous %}
        <a href="{{ page.previous.url | relative_url }}" class="btn btn--3">Last stop</a>
      {% endif %}
      <a href="{{ trail_path | relative_url }}" class="btn btn--3">Trail home</a>
      {% if page.next %}
        <a href="{{ page.next.url | relative_url }}" class="btn btn--3">Next stop</a>
      {% endif %}
    </nav>
  </div>
</section>
