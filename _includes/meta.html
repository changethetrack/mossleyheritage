<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1005">
<meta property="og:site_name" content="{{ site.title }}">

{%- if page.title %}
<title>{{ page.title }} | {{ site.title }}</title>
<meta property="og:title" content="{{ page.title }}">
<meta name="twitter:title" content="{{ page.title }}">
{% else %}
<title>{{ site.title }}</title>
<meta property="og:title" content="{{ site.title }}">
<meta name="twitter:title" content="{{ site.title }}">
{% endif %}
{%- if page.description %}
<meta name="twitter:description" content="{{ page.description }}">
<meta property="og:description" content="{{ page.description }}">
{% else %}
<meta name="twitter:description" content="{{ site.description }}">
<meta property="og:description" content="{{ site.description }}">
{% endif %}
<meta property="og:image" content="{{ '/og.png' | absolute_url }}">
<meta name="twitter:image" content="{{ '/og.png' | absolute_url }}">

<meta property="og:url" content="{{ page.url | absolute_url }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@gfscstudio">

<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="mask-icon" href="{{ '/safari-pinned-tab.svg' | relative_url }}" color="#009CB1">
<meta name="msapplication-TileColor" content="#A3D7DF">
<meta name="theme-color" content="#A3D7DF">
